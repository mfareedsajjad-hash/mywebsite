<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed Success</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl p-8 max-w-md w-full text-center shadow-2xl">
        <div
            class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-3xl mb-4">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <h2 class="text-2xl font-bold text-white mb-1">Order Successfully Placed!</h2>
        <p class="text-xs text-gray-400 mb-6">Aapka Cash on Delivery order receive ho gaya hai.</p>

        <div class="bg-gray-700/50 text-left p-4 rounded-xl space-y-2 text-xs mb-6 border border-gray-600">
            <div><span class="text-gray-400">Order ID:</span> <strong class="text-white">#{{ order_id }}</strong></div>
            <div><span class="text-gray-400">Customer:</span> <strong class="text-white">{{ name }}</strong></div>
            <div><span class="text-gray-400">Phone:</span> <strong class="text-white">{{ phone }}</strong></div>
            <div><span class="text-gray-400">City:</span> <strong class="text-white">{{ city }}</strong></div>
            <div><span class="text-gray-400">Address:</span> <strong class="text-white">{{ address }}</strong></div>
        </div>

        <div class="flex gap-2">
            {% if user.is_authenticated %}
            <a href="/orders/{{ order_id }}/"
                class="inline-block flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition">
                View Order Details
            </a>
            {% endif %}
            <a href="/orders/"
                class="inline-block flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2.5 rounded-xl text-xs transition">
                View Orders
            </a>
            <a href="/"
                class="inline-block flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition">
                Continue Reselling
            </a>
        </div>
    </div>
</body>

</html>
