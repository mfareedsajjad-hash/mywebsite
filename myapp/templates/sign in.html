<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign Up - Fareed's Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }

        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            text-align: center;
        }

        h2 {
            color: #38bdf8;
        }

        p {
            text-align: left;
            margin: 10px 0 2px 0;
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #16a34a;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }

        .helptext {
            display: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Create Account 🚀</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">Pehle se account hai? <a href="/login/">Login karein</a></p>
    </div>
</body>

</html>
