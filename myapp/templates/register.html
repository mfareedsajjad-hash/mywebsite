<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Markaz Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-gray-800 border border-gray-700 rounded-2xl p-8 max-w-md w-full shadow-2xl">
        <div class="text-center mb-6">
            <div class="flex items-center justify-center gap-2 mb-2">
                <span class="text-3xl font-black bg-emerald-600 text-white px-3 py-1 rounded-lg">M</span>
                <span class="font-bold text-2xl text-white">Markaz Store</span>
            </div>
            <h2 class="text-xl font-bold text-white">Create Account</h2>
            <p class="text-xs text-gray-400 mt-1">Join and start reselling today</p>
        </div>

        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
            <div class="bg-{% if message.tags == 'error' %}red{% else %}emerald{% endif %}-500/20 border border-{% if message.tags == 'error' %}red{% else %}emerald{% endif %}-500/50 text-{% if message.tags == 'error' %}red{% else %}emerald{% endif %}-400 px-4 py-3 rounded-lg text-sm">
                <i class="fa-solid fa-{% if message.tags == 'error' %}circle-exclamation{% else %}circle-check{% endif %} mr-2"></i>{{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form action="/register/" method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-gray-300 font-medium mb-1 text-sm">Username</label>
                <input type="text" name="username" required placeholder="Choose a username"
                    class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-500 text-sm">
            </div>
            <div>
                <label class="block text-gray-300 font-medium mb-1 text-sm">Email</label>
                <input type="email" name="email" required placeholder="your@email.com"
                    class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-500 text-sm">
            </div>
            <div>
                <label class="block text-gray-300 font-medium mb-1 text-sm">Password</label>
                <input type="password" name="password" required placeholder="Min 6 characters"
                    class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-500 text-sm">
            </div>
            <div>
                <label class="block text-gray-300 font-medium mb-1 text-sm">Confirm Password</label>
                <input type="password" name="confirm_password" required placeholder="Re-enter password"
                    class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-500 text-sm">
            </div>

            <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition text-sm shadow-lg">
                Create Account
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-xs text-gray-400">Already have an account?</p>
            <a href="/login/" class="text-emerald-400 hover:text-emerald-300 text-sm font-medium">Login here</a>
        </div>

        <div class="mt-4 text-center">
            <a href="/" class="text-gray-400 hover:text-white text-xs">← Back to Store</a>
        </div>
    </div>

</body>

</html>
